# Remote thermometer - common configuration for all boards.
# Board-specific settings are in boards/<board>.conf and boards/<board>.overlay.

# ---------------------------------------------------------------------------
# Thermometer settings (see Kconfig). Sensor wiring (R0, reference resistor,
# 2/3/4-wire, pins) is in the board overlays.
# ---------------------------------------------------------------------------
# Time between two measurement rounds in ms (100 .. 3600000)
CONFIG_APP_SAMPLING_INTERVAL_MS=1000
# Sensors stay off while no BLE client is connected
CONFIG_APP_MEASURE_ONLY_CONNECTED=y
# Sensors that are powered, read and published
CONFIG_APP_SENSOR_1=y
CONFIG_APP_SENSOR_2=y
CONFIG_APP_SENSOR_3=n
CONFIG_APP_SENSOR_4=n
# Advertising: every 100 ms for this many seconds after boot/disconnect, then slowly
CONFIG_APP_ADV_FAST_TIMEOUT_S=30
CONFIG_APP_ADV_SLOW_INTERVAL_MS=1000

# Bluetooth peripheral
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Remote_Thermometer"
CONFIG_BT_MAX_CONN=1

# Just Works pairing with bonding, like the nRF5 SDK Peer Manager setup
# (no MITM, no LESC, no I/O capabilities).
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# Preferred connection parameters, requested from the client 5 s after connecting:
# 400-500 ms interval, peripheral latency 1, 6 s supervision timeout. The thermometer has nothing to
# send between rounds, so with latency 1 it wakes the radio about once a second when idle (the nRF5
# SDK firmware used 100-200 ms, latency 0: 5-10 radio events per second). A notification goes out at
# the next interval (<= 500 ms); a read by a polling client can take up to 1 s to be answered.
# Units: intervals 1.25 ms, timeout 10 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=320
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=400
CONFIG_BT_PERIPHERAL_PREF_LATENCY=1
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Device Information Service
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME_STR="Vladimir_Pokorny"
CONFIG_BT_DIS_PNP=n

# MAX31865 on SPI, load switches on GPIO
CONFIG_GPIO=y
CONFIG_SPI=y

# Hardware floating point (temperature calculation). FPU_SHARING because the measurement
# thread uses the FPU while the BT and logging threads may preempt it.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Release configuration: no logging, no boot banner. The debug configuration (config/debug*.conf,
# .\build.ps1 -Config Debug) adds logging over UART (emulator) or RTT (hardware) and debug info.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# The CPU idles in System ON sleep between events (tickless kernel). Driver runtime power management
# is enabled in the hardware build (boards/nrf52833dk_nrf52833.conf).

CONFIG_THREAD_NAME=y
