# Remote thermometer - the real thermometer (PCB, nRF52833), release configuration.
# Board nrf52833dk/nrf52833 with the PCB pins from boards/nrf52833dk_nrf52833.overlay.
#
# Every build starts from this file:
#   hardware          prj.conf
#   emulator          prj.conf + emulation/emulator.conf (+ emulation/emulator.overlay)
#   -Config Debug     + config/debug.conf + config/debug_hardware.conf or config/debug_emulator.conf
# All differences between the hardware and the emulator build are in emulation/emulator.conf and
# emulation/emulator.overlay.

# ---------------------------------------------------------------------------
# Thermometer settings (see Kconfig). Sensor wiring (R0, reference resistor,
# 2/3/4-wire, pins) is in the board overlay.
# ---------------------------------------------------------------------------
# Time between two measurement rounds in ms (100 .. 3600000)
CONFIG_APP_SAMPLING_INTERVAL_MS=1000
# Sensors stay off while no BLE client is connected
CONFIG_APP_MEASURE_ONLY_CONNECTED=y
# Sensors that are powered, read and published
CONFIG_APP_SENSOR_1=y
CONFIG_APP_SENSOR_2=y
CONFIG_APP_SENSOR_3=n
CONFIG_APP_SENSOR_4=n
# Advertising: every 100 ms for this many seconds after boot/disconnect, then slowly
CONFIG_APP_ADV_FAST_TIMEOUT_S=30
CONFIG_APP_ADV_SLOW_INTERVAL_MS=1000

# Bluetooth peripheral. Link layer: Nordic's SoftDevice Controller, the NCS default.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Remote_Thermometer"
CONFIG_BT_MAX_CONN=1

# Just Works pairing with bonding, like the nRF5 SDK Peer Manager setup
# (no MITM, no LESC, no I/O capabilities).
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y

# Keep bonds and the runtime configuration (Config characteristic) across resets
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# Preferred connection parameters, requested from the client 5 s after connecting:
# 400-500 ms interval, peripheral latency 1, 6 s supervision timeout. The thermometer has nothing to
# send between rounds, so with latency 1 it wakes the radio about once a second when idle (the nRF5
# SDK firmware used 100-200 ms, latency 0: 5-10 radio events per second). A notification goes out at
# the next interval (<= 500 ms); a read by a polling client can take up to 1 s to be answered.
# Units: intervals 1.25 ms, timeout 10 ms.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=320
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=400
CONFIG_BT_PERIPHERAL_PREF_LATENCY=1
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

# Device Information Service
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME_STR="Vladimir_Pokorny"
CONFIG_BT_DIS_PNP=n

# MAX31865 on SPI, load switches on GPIO
CONFIG_GPIO=y
CONFIG_SPI=y

# Hardware floating point (temperature calculation). FPU_SHARING because the measurement
# thread uses the FPU while the BT and logging threads may preempt it.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# No UART (P0.08, UART RX on the DK, is EN_3 on the PCB), no logging, no boot banner: the log thread
# and its formatting would wake the CPU for nothing on a battery device. The debug configuration
# (.\build.ps1 -Config Debug) adds logging over RTT (hardware) or UART (emulator) and debug info.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n

# The CPU idles in System ON sleep between events (tickless kernel). Runtime power management: SPIM is
# suspended, and its pins put in the sleep state, between transfers (zephyr,pm-device-runtime-auto in
# the overlay).
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_THREAD_NAME=y
