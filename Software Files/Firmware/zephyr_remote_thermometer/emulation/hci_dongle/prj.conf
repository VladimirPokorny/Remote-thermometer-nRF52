# Virtual BLE dongle (emulator only, nrf52833dk/nrf52833): BLE controller, H4 HCI on uart0.
# Based on zephyr/samples/bluetooth/hci_uart/prj.conf.

# uart0 carries HCI only: no console or logging on it
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_HCI_RAW_H4=y
CONFIG_BT_HCI_RAW_H4_ENABLE=y
CONFIG_BT_MAX_CONN=4

# Open-source Zephyr link layer: required in Renode (see boards/nrf52833dk_nrf52833.overlay)
CONFIG_BT_LL_SW_SPLIT=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_DEBUG_THREAD_INFO=y
