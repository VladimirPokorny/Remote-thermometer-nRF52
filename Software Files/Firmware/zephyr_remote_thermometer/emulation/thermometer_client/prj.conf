# Test client for the remote thermometer (emulator only, nrf52833dk/nrf52833)
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="Thermometer_Client"

CONFIG_LOG=y

# Open-source Zephyr link layer: required in Renode (see boards/nrf52833dk_nrf52833.overlay)
CONFIG_BT_LL_SW_SPLIT=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y
