# Emulator build (Renode in nrf52_emulator), on top of prj.conf. Same board (nrf52833dk/nrf52833),
# same PCB pins: only what Renode can't run differs. Devicetree part: emulator.overlay.
# Renode models an nRF52840; the nRF52833 firmware runs on it because the peripherals are at the
# same addresses and the nRF52833's flash and RAM are a subset of the nRF52840's.

# Open-source Zephyr link layer (selected in emulator.overlay). Nordic's SoftDevice Controller (MPSL)
# doesn't run in Renode.
CONFIG_BT_LL_SW_SPLIT=y

# Bonds and the runtime configuration in RAM only: Renode has no NVMC (flash controller) model, flash
# writes would hang. The emulator starts from the Kconfig defaults at every restart.
CONFIG_BT_SETTINGS=n
CONFIG_SETTINGS=n
CONFIG_NVS=n
CONFIG_FLASH_MAP=n
CONFIG_FLASH=n

# Test convenience, not required: all four sensors, because the emulator models all four MAX31865.
# Delete these two lines to measure exactly what the hardware build does (e.g. in the Power tab).
CONFIG_APP_SENSOR_3=y
CONFIG_APP_SENSOR_4=y
