# Debug configuration for the emulator build (nRF52840 DK), on top of config/debug.conf.

# Log to uart0: the Terminal tab in the emulator
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y

# LED n on while sensor n's load switch is on (Board tab, Timeline)
CONFIG_APP_SENSOR_LEDS=y
