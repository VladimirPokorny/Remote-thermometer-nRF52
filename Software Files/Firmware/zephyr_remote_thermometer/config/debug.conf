# Debug configuration, both builds. Added on top of the release configuration by
# .\build.ps1 -Config Debug, together with config/debug_hardware.conf or config/debug_emulator.conf.
# Logging and debug info cost CPU time and power: don't ship or measure power with it.

CONFIG_LOG=y
CONFIG_BOOT_BANNER=y

# Readable stepping and thread awareness in a debugger / the emulator's Tasks view
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_MAX_NAME_LEN=32
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_ASSERT=y
