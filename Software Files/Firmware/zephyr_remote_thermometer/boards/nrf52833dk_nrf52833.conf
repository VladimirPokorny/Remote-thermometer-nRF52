# nRF52833 - the real thermometer (PCB pins, see nrf52833dk_nrf52833.overlay).
# Uses Nordic's SoftDevice Controller, the NCS default.

# Release configuration. No UART (P0.08, UART RX on the DK, is EN_3 on the PCB) and no logging: the
# log thread and its formatting would wake the CPU for nothing on a battery device.
# .\build.ps1 -Target hardware -Config Debug adds config/debug.conf and config/debug_nrf52833dk.conf
# (logging over RTT).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

# Runtime power management: SPIM is suspended, and its pins put in the sleep state, between transfers
# (zephyr,pm-device-runtime-auto in the overlay). Not in the emulator build: there it would also
# power-cycle the logging UART around every character.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Keep bonds across resets (the emulator build keeps them in RAM only: Renode has no NVMC model)
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
