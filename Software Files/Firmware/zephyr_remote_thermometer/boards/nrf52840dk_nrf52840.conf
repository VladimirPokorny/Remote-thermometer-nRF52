# nRF52840 DK - the emulator target (Renode, nrf52_emulator). Release configuration: like the hardware
# build, no logging and no UART, so the emulator's Power tab shows what the thermometer would draw.
# .\build.ps1 -Config Debug adds config/debug.conf and config/debug_nrf52840dk.conf (UART log, LEDs).
# See nrf52840dk_nrf52840.overlay for the controller and pin selection.

# All four sensors: the emulator models all four MAX31865
CONFIG_APP_SENSOR_3=y
CONFIG_APP_SENSOR_4=y

# Open-source Zephyr link layer. Nordic's SoftDevice Controller (MPSL) doesn't run in Renode.
CONFIG_BT_LL_SW_SPLIT=y

# Renode has no CryptoCell-310 model: take entropy from the RNG peripheral and
# let nrf_security use software crypto.
CONFIG_HW_CC3XX=n
CONFIG_ENTROPY_CC3XX=n
CONFIG_ENTROPY_NRF5_RNG=y

# No console, no UART
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
